name: Deadline Notifications

on:
  schedule:
    # Noon – 11:45 PM Pacific (covers both PST UTC-8 and PDT UTC-7)
    - cron: "*/15 0-8 * * *"   # midnight–8 AM UTC  (4 PM PST / 5 PM PDT – 12 AM PST / 1 AM PDT)
    - cron: "*/15 19-23 * * *" # 7 PM–11:45 PM UTC  (11 AM PST / 12 PM PDT – 3:45 PM PST / 4:45 PM PDT)
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install @libsql/client

      - name: Check deadlines and notify
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          CLERK_USER_ID: ${{ secrets.CLERK_USER_ID }}
          APP_URL: ${{ secrets.APP_URL }}
        run: node .github/scripts/notify-deadlines.mjs
