name: Deadline Notifications

on:
  schedule:
    # Year-round Pacific coverage (7 AM – 11 PM)
    # PST = UTC-8, PDT = UTC-7, so we use a wide UTC window
    - cron: "*/30 0-7 * * *" # midnight–7:30 AM UTC
    - cron: "*/30 14-23 * * *" # 2 PM–11:30 PM UTC
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install @libsql/client

      - name: Check deadlines and notify
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node .github/scripts/notify-deadlines.mjs
